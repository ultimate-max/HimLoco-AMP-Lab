# policy_path and xml_path are relative to deploy/deploy_sim2sim.
# Leave policy_path empty to select the newest logs/.../exported/policy.pt.
policy_path: ""
xml_path: robot/go2/scene.xml
initial_height: 0.4

simulation_duration: 300.0
simulation_dt: 0.005
control_decimation: 4

joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint

# For each policy-order index, gives the corresponding canonical/MuJoCo index.
# Policy order in Isaac Sim is hip x4, thigh x4, calf x4.
policy_to_mujoco: [0, 3, 6, 9, 1, 4, 7, 10, 2, 5, 8, 11]

kps: [25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25]
kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
default_angles: [0.1, 0.8, -1.5, -0.1, 0.8, -1.5, 0.1, 1.0, -1.5, -0.1, 1.0, -1.5]
effort_limits: [23.4, 23.4, 23.4, 23.4, 23.4, 23.4, 23.4, 23.4, 23.4, 23.4, 23.4, 23.4]
torque_speed_curve: {X1: 13.5, X2: 30.0, Y1: 20.2, Y2: 23.4}

history_length: 6
num_obs: 45
num_actions: 12
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [1.0, 1.0, 1.0]
cmd_init: [0.0, 0.0, 0.0]
command_ranges:
  lin_vel_x: [-1.0, 1.0]
  lin_vel_y: [-1.0, 1.0]
  ang_vel_z: [-2.0, 2.0]

# SDL/Pygame axis indices. The signs match the usual gamepad convention:
# left stick up = +vx, left stick left = +vy, right stick left = +wz.
joystick:
  deadzone: 0.08
  lin_vel_x: {axis: 1, sign: -1.0}
  lin_vel_y: {axis: 0, sign: -1.0}
  ang_vel_z: {axis: 3, sign: -1.0}
  stop_button: 0
